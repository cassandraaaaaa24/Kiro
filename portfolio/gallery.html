<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery — Manus Vindictae</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">✦ Manus Vindictae</a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="gallery.html" class="active">Gallery</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Gallery Header -->
    <section class="gallery-header">
        <h1>Gallery</h1>
        <p>A collection of works spanning sketches, digital paintings, and concept art</p>
    </section>

    <!-- Filter Buttons (auto-generated) -->
    <div class="gallery-filters" id="gallery-filters">
        <button class="filter-btn active" data-filter="all">All</button>
    </div>

    <!-- Gallery Grid (auto-generated) -->
    <section class="gallery">
        <div class="gallery-grid" id="gallery-grid">
            <!-- Gallery items will be generated by JavaScript -->
        </div>
    </section>

    <!-- Modal for lightbox -->
    <div id="gallery-modal" class="modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modal-image" src="" alt="">
        <div class="modal-info">
            <h3 id="modal-title"></h3>
            <p id="modal-description"></p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 Manus Vindictae. All rights reserved.</p>
            <div class="footer-links">
                <a href="contact.html">Contact</a>
                <a href="about.html">About</a>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
